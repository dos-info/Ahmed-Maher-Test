const gr=()=>`<div class="card"><h2>١) ما القاعدة؟</h2><p>نستخدم <b>حروف الجر المكانية + Dativ</b> للإجابة عن السؤال <b>Wo?</b> (أين؟) أي لوصف مكان شخص أو شيء <b>ثابت دون حركة</b>.</p><p>Wo ist das Hotel? – Das Hotel ist <b>neben dem</b> Dom. ${sp('Wo ist das Hotel? Das Hotel ist neben dem Dom.')}</p></div>
